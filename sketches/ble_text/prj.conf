# BLE peripheral with the Nordic UART Service (NUS).
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="HY0020-BLE"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_NUS=y
# Development sample: no pairing/bonding or persistent settings.
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=n

# UART console: TX only, P0.06, 115200 8N1.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n

# Use calibrated internal LFRC; no dependency on the 32.768 kHz crystal.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_NRF_APPROTECT_USE_UICR=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_ASSERT=y
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_BOOTLOADER_MCUBOOT=n
